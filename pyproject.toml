[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-reliability"
version = "0.1.0"
description = "A local-first Python toolkit for analyzing application events, detecting reliability anomalies, and producing evidence-backed incident reports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sentinel Contributors" }]
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "pydantic>=2.6,<3.0",
]

[project.optional-dependencies]
analysis = ["pandas>=2.1,<3.0", "scikit-learn>=1.4,<2.0"]
dev = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<7.0", "ruff>=0.4,<1.0", "mypy>=1.8,<2.0", "httpx>=0.27,<1.0"]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
